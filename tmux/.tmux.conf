# Set a Ctrl-b shortcut for reloading your tmux config
bind r source-file ~/.tmux.conf

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -n 'M-]' if-shell "$is_vim" 'send-keys M-]' 'select-pane -t :.+'
bind-key -n 'M-[' if-shell "$is_vim" 'send-keys M-[' 'select-pane -t :.-'
bind-key -T copy-mode-vi 'M-]' select-pane -t :.+
bind-key -T copy-mode-vi 'M-[' select-pane -t :.-

# Turn off pane swap
unbind-key C-o

set -g mouse on
set -g history-limit 30000

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use Vim style keys
set-window-option -g mode-keys vi

# Set some resize functions (defaults don't work in OSX)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Active pane
# set-option -g pane-active-border-fg colour200
# set-option -g pane-border-fg black

# Status bar customization
# set -g status-utf8 on
set -g status-bg colour200
set -g status-fg white
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-left "#[bg=#ffffff]#[fg=Black]#(whoami) :: ##[fg=Black]#(curl ipecho.net/plain;echo)"
set -g status-justify left
set -g status-interval 1
set -g status-right "#{pomodoro_status} #[fg=black]%a %d #(TZ=America/New_York date '+%%Z %%-I:%%M') #(TZ=Europe/Copenhagen date '+%%Z %%-I:%%M')"
set -g status-right-length 80

# setw -g window-status-current-fg colour232
# setw -g window-status-current-bg colour119

# Clock
set-window-option -g clock-mode-colour cyan
set-window-option -g clock-mode-style 12

# # Use vim keybindings in copy mode
# setw -g mode-keys vi
#
# # Setup 'v' to begin selection as in Vim
# bind-key -t vi-copy v begin-selection
# bind-key -t vi-copy y copy-pipe "reattach-to-user-namespace pbcopy"
#
# # Update default binding of `Enter` to also use copy-pipe
# unbind -t vi-copy Enter
# bind-key -t vi-copy Enter copy-pipe "reattach-to-user-namespace pbcopy"

# Pass focus in/out events to nvim so autoread/checktime can reload changed files
set -g focus-events on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'olimorris/tmux-pomodoro-plus#v1.0.2'
set -g @pomodoro_toggle 't'
set -g @pomodoro_long_break_mins 15
set -g @pomodoro_notifications 'on'
set -g @pomodoro_sound 'Glass'
set -g @pomodoro_granularity 'on'

run '~/.tmux/plugins/tpm/tpm'
